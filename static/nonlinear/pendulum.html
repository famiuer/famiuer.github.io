<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>3D Nonlinear Pendulum & Phase Cylinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=STIX+Two+Text:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-ui: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
            --font-display: 'STIX Two Text', Georgia, serif;
            --bg: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --panel-border: rgba(255, 255, 255, 0.1);
            --toggle-bg: rgba(15, 23, 42, 0.86);
            --toggle-border: rgba(255, 255, 255, 0.14);
            --text: #ffffff;
            --heading: #38bdf8;
            --muted: #dbeafe;
            --accent: #38bdf8;
            --button-bg: #0ea5e9;
            --button-hover: #0284c7;
            --label-muted: #cbd5e1;
            --dot-state: #ef4444;
            --dot-trace: #facc15;
            --dot-separatrix: #94a3b8;
        }

        :root[data-theme="light"] {
            --bg: #f4f8fb;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(15, 23, 42, 0.08);
            --toggle-bg: rgba(255, 255, 255, 0.92);
            --toggle-border: rgba(15, 23, 42, 0.12);
            --text: #0f172a;
            --heading: #0369a1;
            --muted: #475569;
            --accent: #0284c7;
            --button-bg: #0284c7;
            --button-hover: #0369a1;
            --label-muted: #64748b;
            --dot-state: #dc2626;
            --dot-trace: #1e293b;
            --dot-separatrix: #64748b;
        }

        * { box-sizing: border-box; }

        html, body { width: 100%; height: 100%; }

        body { margin: 0; overflow: hidden; background-color: var(--bg); font-family: var(--font-ui); position: relative; color: var(--text); }
        
        #ui-container {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            width: min(320px, calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 40px));
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            color: var(--text);
            z-index: 10;
            max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 40px);
            overflow: auto;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        #panel-toggle {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 20;
            display: none;
            width: auto;
            margin: 0;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: var(--toggle-bg);
            backdrop-filter: blur(10px);
            color: var(--text);
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.35);
        }

        #theme-toggle {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: max(76px, calc(env(safe-area-inset-right) + 76px));
            z-index: 20;
            width: 44px;
            height: 44px;
            margin: 0;
            border-radius: 999px;
            border: 1px solid var(--toggle-border);
            background: var(--toggle-bg);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1;
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.2);
        }

        h1 { margin: 0 0 5px 0; font-size: 1.2rem; color: var(--heading); font-family: var(--font-display); letter-spacing: -0.02em; }
        p { margin: 0 0 15px 0; font-size: 0.85rem; color: var(--muted); line-height: 1.45; }

        .control-group { margin-bottom: 15px; }
        
        label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.9rem; 
            margin-bottom: 5px;
            color: var(--text);
        }
        
        .val-display { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; color: var(--accent); }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            background: #334155;
        }

        button {
            width: 100%;
            padding: 10px;
            background: var(--button-bg);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        button:hover { background: var(--button-hover); }

        .legend {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-state { background: var(--dot-state); }
        .dot-trace { background: var(--dot-trace); }
        .dot-separatrix { background: var(--dot-separatrix); }
        mjx-container { color: var(--text) !important; font-size: 1.03em !important; }

        #labels {
            position: absolute;
            left: 0;
            right: 0;
            bottom: max(20px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 0 20px;
            color: var(--label-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        #labels span { margin: 0 !important; }

        @media (max-width: 700px) {
            #panel-toggle {
                display: block;
            }

            #ui-container {
                top: max(8px, env(safe-area-inset-top));
                left: max(8px, env(safe-area-inset-left));
                right: max(8px, env(safe-area-inset-right));
                width: auto;
                padding: 14px;
                max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 16px);
            }

            h1 { font-size: 1.05rem; }
            p, label, .legend { font-size: 0.8rem; }

            #labels {
                flex-direction: column;
                align-items: center;
                gap: 4px;
                font-size: 0.75rem;
                bottom: max(8px, env(safe-area-inset-bottom));
            }

            body.controls-collapsed #ui-container {
                transform: translateY(calc(-100% - 24px));
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

        <button id="panel-toggle" type="button" aria-expanded="false">Controls</button>
    <button id="theme-toggle" type="button" aria-label="Toggle color scheme">☾</button>

    <div id="ui-container">
        <h1>Nonlinear Pendulum</h1>
        <p>
            $\ddot{\theta} + b\dot{\theta} + \sin\theta = 0$<br>
            Interactive pendulum view with the matching phase cylinder.
        </p>

        <div class="control-group">
            <label>Energy (Init Speed) <span id="eVal" class="val-display">E &lt; 1</span></label>
            <input type="range" id="energySlider" min="0" max="3.5" step="0.1" value="1.8">
            <small style="color: var(--label-muted); display:block; margin-top:2px;">(0=Rest, 2=Over Top)</small>
        </div>

        <div class="control-group">
            <label>Damping (b) <span id="bVal" class="val-display">0.00</span></label>
            <input type="range" id="dampSlider" min="0" max="0.5" step="0.01" value="0.0">
        </div>

        <button id="resetBtn">Reset Simulation</button>

        <div class="legend">
            <div class="legend-item"><span class="dot dot-state"></span> Current State</div>
            <div class="legend-item"><span class="dot dot-trace"></span> Trajectory Trace</div>
            <div class="legend-item"><span class="dot dot-separatrix"></span> Separatrix (E=1)</div>
        </div>
    </div>

    <div id="labels">
        <span style="margin-right: 20vw;">Physical Space</span>
        <span style="margin-left: 20vw;">Cylindrical Phase Space $(\theta, v)$</span>
    </div>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const THEME_KEY = 'nonlinear-demo-theme';
        const themeToggle = document.getElementById('theme-toggle');
        const themePalettes = {
            dark: {
                sceneBg: 0x0f172a,
                pivot: 0x94a3b8,
                rod: 0xcbd5e1,
                bob: 0xef4444,
                particle: 0xef4444,
                trail: 0xfacc15,
                trailPointSize: 0.11,
                trailPointOpacity: 0.9,
                textureFill: 'rgba(255,255,255,0.07)',
                textureGrid: 'rgba(255,255,255,0.24)',
                separatrix: '#64748b'
            },
            light: {
                sceneBg: 0xf4f8fb,
                pivot: 0x64748b,
                rod: 0x334155,
                bob: 0xdc2626,
                particle: 0xdc2626,
                trail: 0x1e293b,
                trailPointSize: 0.11,
                trailPointOpacity: 0.95,
                textureFill: 'rgba(15,23,42,0.03)',
                textureGrid: 'rgba(15,23,42,0.16)',
                separatrix: '#64748b'
            }
        };
        let currentTheme = 'dark';

        function getPreferredTheme() {
            const stored = localStorage.getItem(THEME_KEY);
            if (stored === 'light' || stored === 'dark') return stored;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        const config = {
            g: 9.8,
            L: 1.0,
            dt: 0.015,
            trailLength: 200,
            cylinderRadius: 1.5,
            cylinderHeight: 6
        };

        // State variables
        // theta: angle from downward vertical (0 = bottom)
        // v: angular velocity
        let state = { theta: 0.5, v: 0.0 };
        let damping = 0.0;
        let trail = [];

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(themePalettes.dark.sceneBg);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        renderer.domElement.style.touchAction = 'none';

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Group 1: Physical Pendulum (Left Side) ---
        const physGroup = new THREE.Group();
        physGroup.position.x = -2.5;
        scene.add(physGroup);

        // Pivot
        const pivotGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.5);
        const pivotMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
        const pivot = new THREE.Mesh(pivotGeo, pivotMat);
        pivot.rotation.x = Math.PI / 2;
        physGroup.add(pivot);

        // Rod
        const rodGeo = new THREE.CylinderGeometry(0.02, 0.02, config.L);
        const rodMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1 });
        const rod = new THREE.Mesh(rodGeo, rodMat);
        rod.geometry.translate(0, -config.L/2, 0); // Pivot at top
        physGroup.add(rod);

        // Bob
        const bobGeo = new THREE.SphereGeometry(0.2, 32, 32);
        const bobMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 });
        const bob = new THREE.Mesh(bobGeo, bobMat);
        bob.position.y = -config.L;
        rod.add(bob); // Attach bob to rod so it rotates with it

        // --- Group 2: Phase Cylinder (Right Side) ---
        const phaseGroup = new THREE.Group();
        phaseGroup.position.x = 2.5;
        scene.add(phaseGroup);

        function applyResponsiveLayout() {
            const isMobile = window.innerWidth <= 700;

            if (isMobile) {
                physGroup.position.set(0, 2.1, 0);
                phaseGroup.position.set(0, -2.1, 0);
                camera.position.set(0, 1.2, 11.5);
            } else {
                physGroup.position.set(-2.5, 0, 0);
                phaseGroup.position.set(2.5, 0, 0);
                camera.position.set(0, 2, 9);
            }

            controls.target.set(0, 0, 0);
            controls.update();
        }

        // Cylinder Mesh (Transparent)
        // Texture for grid lines
        function buildPhaseTexture(theme) {
            const textureCanvas = document.createElement('canvas');
            textureCanvas.width = 512;
            textureCanvas.height = 512;
            const textureCtx = textureCanvas.getContext('2d');
            textureCtx.fillStyle = theme.textureFill;
            textureCtx.fillRect(0, 0, 512, 512);
            textureCtx.strokeStyle = theme.textureGrid;
            textureCtx.lineWidth = 2;
            for (let i = 0; i <= 4; i++) {
                textureCtx.beginPath(); textureCtx.moveTo(0, i * 128); textureCtx.lineTo(512, i * 128); textureCtx.stroke();
                textureCtx.beginPath(); textureCtx.moveTo(i * 128, 0); textureCtx.lineTo(i * 128, 512); textureCtx.stroke();
            }
            textureCtx.strokeStyle = theme.separatrix;
            textureCtx.lineWidth = 4;
            textureCtx.beginPath();
            for (let x = 0; x <= 512; x++) {
                const angle = (x / 512) * Math.PI * 2;
                const y = 256 + Math.cos(angle) * 100;
                if (x === 0) textureCtx.moveTo(x, y); else textureCtx.lineTo(x, y);
            }
            textureCtx.stroke();
            textureCtx.beginPath();
            for (let x = 0; x <= 512; x++) {
                const angle = (x / 512) * Math.PI * 2;
                const y = 256 - Math.cos(angle) * 100;
                if (x === 0) textureCtx.moveTo(x, y); else textureCtx.lineTo(x, y);
            }
            textureCtx.stroke();
            return new THREE.CanvasTexture(textureCanvas);
        }

        const tex = buildPhaseTexture(themePalettes.dark);
        const cylGeo = new THREE.CylinderGeometry(config.cylinderRadius, config.cylinderRadius, config.cylinderHeight, 64, 1, true);
        const cylMat = new THREE.MeshBasicMaterial({ 
            map: tex, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.8,
            depthWrite: false
        });
        const cylinder = new THREE.Mesh(cylGeo, cylMat);
        phaseGroup.add(cylinder);

        // Phase Particle
        const pParticle = new THREE.Mesh(
            new THREE.SphereGeometry(0.15),
            new THREE.MeshBasicMaterial({ color: 0xef4444 })
        );
        phaseGroup.add(pParticle);

        // Trajectory Line
        const trailGeo = new THREE.BufferGeometry();
        const trailMat = new THREE.LineBasicMaterial({ color: 0xfbbf24 });
        const trailLine = new THREE.Line(trailGeo, trailMat);
        phaseGroup.add(trailLine);
        const trailPointMat = new THREE.PointsMaterial({
            color: 0xfbbf24,
            size: 0.11,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.9
        });
        const trailDots = new THREE.Points(trailGeo, trailPointMat);
        phaseGroup.add(trailDots);

        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem(THEME_KEY, theme);
            document.documentElement.dataset.theme = theme;
            themeToggle.textContent = theme === 'dark' ? '☀' : '☾';
            themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');

            const palette = themePalettes[theme];
            scene.background = new THREE.Color(palette.sceneBg);
            pivotMat.color.setHex(palette.pivot);
            rodMat.color.setHex(palette.rod);
            bobMat.color.setHex(palette.bob);
            pParticle.material.color.setHex(palette.particle);
            trailMat.color.setHex(palette.trail);
            trailPointMat.color.setHex(palette.trail);
            trailPointMat.size = palette.trailPointSize;
            trailPointMat.opacity = palette.trailPointOpacity;
            cylMat.map.dispose();
            cylMat.map = buildPhaseTexture(palette);
            cylMat.needsUpdate = true;
        }

        // --- Physics Engine ---

        function getDerivatives(s) {
            // d(theta)/dt = v
            // d(v)/dt = -sin(theta) - damping*v
            return {
                dTheta: s.v,
                dv: -Math.sin(s.theta) - damping * s.v
            };
        }

        function rk4Step(s, dt) {
            let k1 = getDerivatives(s);
            
            let s2 = { theta: s.theta + k1.dTheta*dt*0.5, v: s.v + k1.dv*dt*0.5 };
            let k2 = getDerivatives(s2);
            
            let s3 = { theta: s.theta + k2.dTheta*dt*0.5, v: s.v + k2.dv*dt*0.5 };
            let k3 = getDerivatives(s3);
            
            let s4 = { theta: s.theta + k3.dTheta*dt, v: s.v + k3.dv*dt };
            let k4 = getDerivatives(s4);

            return {
                theta: s.theta + (k1.dTheta + 2*k2.dTheta + 2*k3.dTheta + k4.dTheta)*dt/6,
                v: s.v + (k1.dv + 2*k2.dv + 2*k3.dv + k4.dv)*dt/6
            };
        }

        // --- Helper: Map (theta, v) to 3D Cylinder Coords ---
        function toCylinder(theta, v) {
            // Theta maps to angle around Y axis
            // v maps to Height (Y axis)
            
            // Normalize theta to 0..2PI for visual stability on texture? 
            // Actually, we want continuous wrapping.
            // x = r * sin(theta)
            // z = r * cos(theta)
            // y = v * scale
            
            // Note: In ThreeJS, Cylinder stands on Y.
            // Physics theta 0 is bottom (stable). 
            // In cylinder phase space 0 is usually front center.
            
            const r = config.cylinderRadius;
            // Shift theta by PI so 0 (bottom) is at the "back" or "front" as preferred.
            // Let's keep it simple: theta corresponds directly to rotation.
            
            const x = r * Math.sin(theta);
            const z = r * Math.cos(theta); 
            const y = v * 0.5; // Scale velocity to fit height

            return new THREE.Vector3(x, y, z);
        }

        // --- Interaction ---
        const sliderE = document.getElementById('energySlider');
        const sliderB = document.getElementById('dampSlider');
        const btnReset = document.getElementById('resetBtn');
        const dispE = document.getElementById('eVal');
        const dispB = document.getElementById('bVal');
        const panelToggle = document.getElementById('panel-toggle');
        let wasMobileViewport = window.innerWidth <= 700;

        function syncMobilePanel(forceCollapse = false) {
            const isMobileViewport = window.innerWidth <= 700;

            if (isMobileViewport) {
                panelToggle.style.display = 'block';
                if (forceCollapse || !wasMobileViewport) {
                    document.body.classList.add('controls-collapsed');
                }
            } else {
                panelToggle.style.display = 'none';
                document.body.classList.remove('controls-collapsed');
            }

            panelToggle.textContent = document.body.classList.contains('controls-collapsed') ? 'Controls' : 'Hide';
            panelToggle.setAttribute('aria-expanded', String(!document.body.classList.contains('controls-collapsed')));
            wasMobileViewport = isMobileViewport;
        }

        panelToggle.addEventListener('click', () => {
            document.body.classList.toggle('controls-collapsed');
            syncMobilePanel();
        });

        themeToggle.addEventListener('click', () => {
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        function reset() {
            trail = [];
            // Init based on Energy slider.
            // We set start at bottom (theta=0) with velocity based on E.
            // E = v^2 / 2 - cos(theta)
            // Wait, standard potential is V = 1 - cos(theta) usually, or -cos(theta).
            // Text says E = 1/2 v^2 - cos(theta).
            // Min Energy (Rest at bottom) = -1.
            // Separatrix (Rest at top) = 1.
            
            // Slider 0..3.5 is "velocity kick".
            const kick = parseFloat(sliderE.value);
            state = { theta: 0.01, v: kick }; // Start slightly off 0 for dynamics
            damping = parseFloat(sliderB.value);
            
            // Update labels
            dispB.textContent = damping.toFixed(2);
            let E = 0.5*state.v*state.v - Math.cos(state.theta);
            if(E < 1) dispE.textContent = "Libration (E<1)";
            else if(Math.abs(E-1) < 0.1) dispE.textContent = "Separatrix (E~1)";
            else dispE.textContent = "Rotation (E>1)";
        }

        sliderE.addEventListener('input', reset);
        sliderB.addEventListener('input', () => {
            damping = parseFloat(sliderB.value);
            dispB.textContent = damping.toFixed(2);
        });
        btnReset.addEventListener('click', reset);

        // --- Animation Loop ---

        function animate() {
            requestAnimationFrame(animate);

            // 1. Physics Step (Sub-steps for accuracy)
            for(let i=0; i<4; i++) {
                state = rk4Step(state, config.dt);
            }

            // 2. Update Physical Pendulum
            rod.rotation.z = state.theta; 

            // 3. Update Phase Particle
            const pos = toCylinder(state.theta, state.v);
            pParticle.position.copy(pos);

            // 4. Update Trail
            trail.push(pos.clone());
            if(trail.length > config.trailLength) trail.shift();

            // Update Line Geometry
            const points = trail.flatMap(p => [p.x, p.y, p.z]);
            trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
            trailGeo.computeBoundingSphere();

            // 5. Camera & Render
            // Optional: Rotate cylinder group slowly for better viewing? No, keeps it confusing.
            // phaseGroup.rotation.y += 0.001; 

            controls.update();
            renderer.render(scene, camera);
        }

        // Init
        applyTheme(getPreferredTheme());
        syncMobilePanel(true);
        applyResponsiveLayout();
        reset();
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            applyResponsiveLayout();
            syncMobilePanel();
        });
    </script>
</body>
</html>
